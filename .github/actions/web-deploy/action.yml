name: Web deploy
description: Builds the web app for one environment, deploys it with Kamal (or runs kamal setup) and checks /up

inputs:
  destination:
    description: Kamal destination; leave empty for production
    required: false
    default: ""
  setup:
    description: Run kamal setup instead of kamal deploy
    required: false
    default: "false"
  app-host:
    description: Host name the app is served from
    required: true
  api-base-url:
    description: Base URL of the API, ending in /api/v1
    required: true
  indexable:
    description: Let search engines index the app (true only in production)
    required: true
  ssh-private-key:
    description: Private key of the deploy user
    required: true
  ssh-known-hosts:
    description: known_hosts line of the server
    required: true

runs:
  using: composite
  steps:
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.47.9
        channel: stable
        cache: true

    - name: Prepare search engine files
      shell: bash
      env:
        APP_HOST: ${{ inputs.app-host }}
        INDEXABLE: ${{ inputs.indexable }}
      run: tool/prepare_web_build.sh web "https://$APP_HOST" "$INDEXABLE"

    - name: Build web
      shell: bash
      env:
        API_BASE_URL: ${{ inputs.api-base-url }}
      run: |
        flutter pub get
        dart run build_runner build --delete-conflicting-outputs
        flutter build web --release --no-web-resources-cdn --dart-define=API_BASE_URL="$API_BASE_URL"

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: "3.3"

    - name: Install Kamal
      shell: bash
      run: gem install kamal -v 2.12.0 --no-document

    - name: Set up QEMU for arm64 images
      if: env.DEPLOY_ARCH == 'arm64'
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v4

    - name: Configure SSH
      shell: bash
      env:
        SSH_PRIVATE_KEY: ${{ inputs.ssh-private-key }}
        SSH_KNOWN_HOSTS: ${{ inputs.ssh-known-hosts }}
      run: |
        install -m 700 -d ~/.ssh
        printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
        chmod 600 ~/.ssh/id_deploy
        printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
        printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' > ~/.ssh/config

    - name: Deploy
      shell: bash
      env:
        DESTINATION: ${{ inputs.destination }}
        SETUP: ${{ inputs.setup }}
      run: |
        command=deploy
        if [ "$SETUP" = "true" ]; then command=setup; fi
        kamal "$command" ${DESTINATION:+-d "$DESTINATION"}

    - name: Check health
      shell: bash
      env:
        APP_HOST: ${{ inputs.app-host }}
      run: curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-connrefused "https://$APP_HOST/up"
