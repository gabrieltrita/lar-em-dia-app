name: CI

on:
  pull_request:
  push:
    branches: [ dev ]
  workflow_call:

permissions:
  contents: read

env:
  TEST_SHARDS: 2

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Test web content scripts
        run: node --test 'test/web/*.test.mjs'

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [ 0, 1 ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mapfile -t files < <(tool/test_files.sh "$SHARD" "$TEST_SHARDS")
          flutter test --coverage --coverage-path "coverage/shard-$SHARD.info" --concurrency "$(nproc)" "${files[@]}"

      - name: Upload shard coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage/shard-${{ matrix.shard }}.info
          retention-days: 1

  coverage:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download shard coverage
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-shard-*
          path: coverage
          merge-multiple: true

      - name: Merge coverage
        run: tool/merge_coverage.sh coverage/lcov.info coverage/shard-*.info

      - name: Enforce lib/core coverage
        run: tool/check_core_coverage.sh

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info

  build_web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build web
        run: flutter build web --dart-define=API_BASE_URL=https://example.invalid/api/v1
