name: CI

on:
  pull_request:
  push:
    branches: [ dev ]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Enforce lib/core coverage
        run: tool/check_core_coverage.sh

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Test web content scripts
        run: node --test 'test/web/*.test.mjs'

      - name: Build web
        run: flutter build web --dart-define=API_BASE_URL=https://example.invalid/api/v1

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Android release with a throwaway key
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ci.jks
          ANDROID_KEYSTORE_PASSWORD: ci-only-password
          ANDROID_KEY_ALIAS: ci
          ANDROID_KEY_PASSWORD: ci-only-password
        run: |
          keytool -genkeypair -keystore "$ANDROID_KEYSTORE_PATH" -alias ci -keyalg RSA -keysize 2048 -validity 1 \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEY_PASSWORD -dname "CN=CI"
          flutter build appbundle --release --dart-define=API_BASE_URL=https://example.invalid/api/v1
          unzip -p build/app/outputs/bundle/release/app-release.aab base/manifest/AndroidManifest.xml \
            | grep -aq android.permission.INTERNET

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
